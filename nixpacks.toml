# Nixpacks Configuration for Single Service Deployment

# 1. Setup Phase: Install Python and Node.js
[phases.setup]
nixPkgs = ["python311", "nodejs"]

# 2. Install Phase: Install Backend and Frontend Dependencies
[phases.install]
cmds = [
    "pip install -r backend/requirements.txt",
    "cd frontend && npm install"
]

# 3. Build Phase: Build React Frontend
[phases.build]
cmds = [
    "cd frontend && npm run build"
]

# 4. Start Command: Run FastAPI (which serves the frontend)
[start]
cmd = "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
